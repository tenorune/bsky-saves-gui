name: Coordination PR

# Pushes a coordination artifact (typically a fully revised cross-repo
# contract doc) from this repo into `tenorune/bsky-saves-coordination`
# as a PR. Designed for the multi-team coordination flow where each
# primary repo (gui / cli / installer) drafts amendments locally and
# the canonical contract lives in the neutral coordination repo.
#
# Manual trigger only. Run from the Actions tab → "Coordination PR" →
# "Run workflow". You'll be asked for:
#   - source: path in this repo to the artifact (e.g.
#     coordination/installer-status-panel/2026-05-18-gui-revision.md)
#   - target: path in the coord repo to write to (e.g.
#     docs/installer-status-panel.md)
#   - title:  PR title
#
# The workflow creates a fresh branch in the coord repo named
# `gui/coordination-<run-id>`, copies the source over the target,
# commits, and opens a PR. No `repository_dispatch` plumbing needed —
# we use the GitHub REST API directly via `gh`.
#
# Secret required: BSKY_SAVES_COORDINATION_TOKEN (fine-grained PAT scoped
# to `tenorune/bsky-saves-coordination`, with Contents: read-and-write
# and Pull requests: read-and-write). When the secret is absent the
# workflow exits with a warning instead of failing — keeps the repo
# clean for forks that don't have the coord repo set up.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch in this repo to read the source file from. Coordination artifacts live on the long-lived `coordination` branch by design — they never touch main.'
        required: false
        type: string
        default: coordination
      source:
        description: 'Path in this repo (under source_ref) to the artifact to push (e.g. coordination/installer-status-panel/2026-05-18-gui-revision.md)'
        required: true
        type: string
      target:
        description: 'Path in the coord repo to write to (e.g. docs/installer-status-panel.md)'
        required: true
        type: string
      title:
        description: 'PR title'
        required: true
        type: string
      base:
        description: 'Base branch in coord repo to PR against'
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  open-coordination-pr:
    runs-on: ubuntu-latest
    env:
      # Job-level so step `if:` expressions can read it. Same pattern we
      # use in release.yml for BSKY_SAVES_DISPATCH_TOKEN.
      COORD_TOKEN: ${{ secrets.BSKY_SAVES_COORDINATION_TOKEN }}
    steps:
      - name: Check secret presence
        if: env.COORD_TOKEN == ''
        run: |
          echo "::warning::BSKY_SAVES_COORDINATION_TOKEN is unset. Configure it as a repo secret to enable cross-repo coordination PRs."
          echo "Skipping PR step. See README for setup."
          exit 0

      - name: Checkout this repo (coordination branch)
        if: env.COORD_TOKEN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source-repo

      - name: Validate source file exists
        if: env.COORD_TOKEN != ''
        run: |
          if [ ! -f "source-repo/${{ inputs.source }}" ]; then
            echo "::error::Source file not found: ${{ inputs.source }}"
            exit 1
          fi
          if [ ! -s "source-repo/${{ inputs.source }}" ]; then
            echo "::error::Source file is empty: ${{ inputs.source }}"
            exit 1
          fi

      - name: Checkout coordination repo
        if: env.COORD_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: tenorune/bsky-saves-coordination
          token: ${{ env.COORD_TOKEN }}
          path: coord-repo
          ref: ${{ inputs.base }}

      - name: Apply changes and push branch
        if: env.COORD_TOKEN != ''
        working-directory: coord-repo
        run: |
          BRANCH="gui/coordination-${GITHUB_RUN_ID}"
          git config user.name 'bsky-saves-gui coordination workflow'
          git config user.email '${{ github.actor }}@users.noreply.github.com'
          git checkout -b "$BRANCH"
          # mkdir -p so the workflow handles a target path one or more
          # directories deep (e.g. docs/whatever/foo.md) on a clean repo
          # where the parent doesn't yet exist.
          mkdir -p "$(dirname "${{ inputs.target }}")"
          cp "../source-repo/${{ inputs.source }}" "${{ inputs.target }}"
          git add "${{ inputs.target }}"
          if git diff --cached --quiet; then
            echo "::warning::No changes to ${{ inputs.target }} — source matches existing canonical. Aborting PR creation."
            exit 0
          fi
          git commit -m "${{ inputs.title }}"
          git push -u origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open PR via gh
        if: env.COORD_TOKEN != '' && env.BRANCH != ''
        working-directory: coord-repo
        env:
          GH_TOKEN: ${{ env.COORD_TOKEN }}
        run: |
          gh pr create \
            --repo tenorune/bsky-saves-coordination \
            --base "${{ inputs.base }}" \
            --head "${BRANCH}" \
            --title "${{ inputs.title }}" \
            --body "$(cat <<'EOF'
          Opened automatically by `bsky-saves-gui`'s coordination workflow.

          **Source:** [`${{ inputs.source }}`](https://github.com/tenorune/bsky-saves-gui/blob/${{ github.sha }}/${{ inputs.source }}) in `bsky-saves-gui` @ \`${{ github.sha }}\`

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          See the cross-repo coordination process documented in `bsky-saves-coordination/README.md` for context.
          EOF
          )"
