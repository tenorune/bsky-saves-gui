name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_DOMAIN: ${{ vars.VITE_APP_DOMAIN }}
          VITE_OPERATOR_HANDLE: ${{ vars.VITE_OPERATOR_HANDLE }}
          VITE_BEACON_AT_URI: ${{ vars.VITE_BEACON_AT_URI }}
          VITE_DEFAULT_PDS: ${{ vars.VITE_DEFAULT_PDS }}
          VITE_HELPER_ORIGIN: ${{ vars.VITE_HELPER_ORIGIN }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_PYODIDE_VERSION: ${{ vars.VITE_PYODIDE_VERSION }}
          VITE_OPERATOR_IMAGE_PROXY_URL: ${{ vars.VITE_OPERATOR_IMAGE_PROXY_URL }}
          # Not a confidential secret — Vite inlines every VITE_* var into the
          # public bundle. Sourced from vars.* (not secrets.*) so the workflow
          # reflects the actual threat model and downstream consumers (wheel,
          # installer) don't mistake the value for a credential.
          VITE_OPERATOR_IMAGE_PROXY_KEY: ${{ vars.VITE_OPERATOR_IMAGE_PROXY_KEY }}
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
