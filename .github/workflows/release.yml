name: release

# Release-gate workflow (docs/bsky-saves-gui-dist-workstream.md §5).
#
# Triggers:
#   - push to a vX.Y.Z tag: full gate + attach artifacts to a GitHub release.
#   - workflow_dispatch: dry-run; same gate, artifacts uploaded to the workflow
#     run (Actions → run → Artifacts) but no GitHub release is created.
#
# Gate split (docs/bsky-saves-gui-dist-workstream.md §5):
#
# ci.yml (every PR + push to main) runs S1, S2, S3, S4 and the cheap S6
# scans (credential gate, keyword informational, prod dep audit). It
# guards what reaches the Pages deploy at saves.lightseed.net.
#
# This workflow (tag push only) re-runs S1 then runs the tag-only gates:
#   S5 (static) Playwright runtime smoke against a statically-served dist/.
#   S6 SBOM — CycloneDX bill of materials attached to the release.
#   S8 MIN_HELPER_VERSION — assert GUI's required helper floor does not
#      exceed the latest published bsky-saves on PyPI.
#   S9 artifact production — dist.tar.gz + .sha256 + dist-with-maps.tar.gz.
#   Cross-repo bump — repository_dispatch to tenorune/bsky-saves with the
#      new version + tarball sha256, so its receiving workflow can open a
#      "Bump GUI to vX.Y.Z" PR.
#
# Deferred to later phases: S5 (helper-served) Playwright vs real wheel,
# S7 cross-context boot.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Label for this dry-run build (e.g. v0.3.0-rc1)'
        required: true
        default: 'dry-run'

permissions:
  contents: write  # required so the tag-push path can attach to the release

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    # Job-level env so the cross-repo-bump steps can gate on
    # env.BSKY_SAVES_DISPATCH_TOKEN inside their `if:` conditions —
    # the `secrets` context isn't accessible in step-level `if:`,
    # only `env` is.
    env:
      BSKY_SAVES_DISPATCH_TOKEN: ${{ secrets.BSKY_SAVES_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # ── S1 — Build cleanliness ───────────────────────────────────────────
      - name: S1 — Install
        run: pnpm install --frozen-lockfile

      - name: Seed .env with defaults
        # The build step below overrides VITE_* via env: with repo-vars. The
        # .env file is still needed so `pnpm check`/`pnpm test` have non-empty
        # values for config.ts's required() guards.
        run: cp .env.example .env

      - name: S1 — Type-check
        run: pnpm check

      - name: S1 — Unit tests
        run: pnpm test

      - name: S1 — Cloudflare Worker tests
        run: pnpm exec vitest run --config templates/cf-worker/vitest.config.ts
        timeout-minutes: 3

      - name: S1 — Build
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_DOMAIN: ${{ vars.VITE_APP_DOMAIN }}
          VITE_OPERATOR_HANDLE: ${{ vars.VITE_OPERATOR_HANDLE }}
          VITE_BEACON_AT_URI: ${{ vars.VITE_BEACON_AT_URI }}
          VITE_DEFAULT_PDS: ${{ vars.VITE_DEFAULT_PDS }}
          VITE_HELPER_ORIGIN: ${{ vars.VITE_HELPER_ORIGIN }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_PYODIDE_VERSION: ${{ vars.VITE_PYODIDE_VERSION }}
          VITE_OPERATOR_IMAGE_PROXY_URL: ${{ vars.VITE_OPERATOR_IMAGE_PROXY_URL }}
          VITE_OPERATOR_IMAGE_PROXY_KEY: ${{ vars.VITE_OPERATOR_IMAGE_PROXY_KEY }}
        run: pnpm build

      - name: Confirm CNAME is in dist
        run: test -f dist/CNAME

      # S2–S4 and the cheap S6 scans (credential, keyword, dep audit)
      # run in ci.yml on every PR and push to main. They are not
      # repeated here — if a tag is being cut from a branch that never
      # passed ci.yml, fix the branch protection, not this workflow.

      # ── S5 (static) — Playwright runtime smoke against served dist/ ─────
      #
      # Boots the production bundle behind `python -m http.server` (matches
      # the GitHub-Pages-style static-serving context, not vite preview) and
      # runs the e2e suite in headless Chromium. Catches bundle-level
      # regressions that unit tests can't see: page mount failures, CSP
      # violations, broken route guards, malformed manifest, missing icons.
      #
      # The "helper-served" S5 variant (against a real `bsky-saves serve
      # --gui` wheel) is deferred until the wheel ships with the GUI
      # vendored — tracked in docs/bsky-saves-mvp-spec.md.
      - name: S5 (static) — Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: S5 (static) — Playwright e2e
        run: pnpm exec playwright test

      - name: S5 (static) — Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── S6 — Security: SBOM ─────────────────────────────────────────────
      #
      # The S6 hygiene scans (credential-shape gate, broad keyword
      # informational, production dep audit) live in ci.yml — every PR
      # and push to main runs them, so they're already green by the time
      # this workflow fires on a tag. Only the SBOM ships from here
      # because it's a release-attached artifact.
      - name: S6 — CycloneDX SBOM
        # Scans the production dependency tree (per --required-only) and emits
        # a CycloneDX 1.x JSON SBOM. Pinned to a specific cdxgen version so
        # the SBOM shape is stable across runs; bump deliberately. The SBOM
        # ships alongside the release tarball so downstream consumers (wheel,
        # installers) can audit the exact transitive deps the bundle was
        # built against and diff between releases.
        run: |
          set -euo pipefail
          pnpm dlx @cyclonedx/cdxgen@12.3.3 -o SBOM.cdx.json -t pnpm --required-only
          echo "SBOM produced:"
          ls -l SBOM.cdx.json
          # Sanity-check: must be valid JSON with the CycloneDX shape and a
          # non-zero component count.
          node -e '
            const sbom = JSON.parse(require("fs").readFileSync("SBOM.cdx.json", "utf8"));
            if (sbom.bomFormat !== "CycloneDX") { console.error("Not a CycloneDX SBOM"); process.exit(1); }
            const n = (sbom.components || []).length;
            if (n < 10) { console.error(`SBOM component count suspiciously low: ${n}`); process.exit(1); }
            console.log(`OK: CycloneDX ${sbom.specVersion}, ${n} components`);
          '

      # ── S8 — MIN_HELPER_VERSION coordination ────────────────────────────
      #
      # Assert that the GUI's MIN_HELPER_VERSION (lib/min-helper-version.ts)
      # is <= the latest bsky-saves release on PyPI. Prevents shipping a GUI
      # whose required helper floor isn't actually available yet — which
      # would orphan every wheel user the moment bsky-saves bumps
      # GUI_VERSION to bundle this tag.
      - name: S8 — MIN_HELPER_VERSION vs PyPI
        run: node tools/verify-min-helper-version.mjs

      # ── S9 — Artifact production ─────────────────────────────────────────
      #
      # Stage a release-staging copy of dist/ with sourcemaps stripped —
      # that's what gets packed into dist.tar.gz. dist/ itself (with
      # maps) rides out separately as dist-with-maps.tar.gz for
      # debugging. The hygiene checks that used to operate on
      # release-staging here have moved to ci.yml.
      - name: Stage release dist (strip sourcemaps)
        run: |
          set -euo pipefail
          rm -rf release-staging
          cp -r dist release-staging
          find release-staging -name '*.map' -delete

      - name: Determine version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: S9 — Pack release tarball
        run: |
          set -euo pipefail
          tar czf dist.tar.gz -C release-staging .
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          echo "Release tarball:"
          ls -l dist.tar.gz dist.tar.gz.sha256

      - name: S9 — Pack debug-with-maps tarball
        run: |
          set -euo pipefail
          tar czf dist-with-maps.tar.gz -C dist .
          echo "Debug tarball:"
          ls -l dist-with-maps.tar.gz

      - name: Upload release artifacts (workflow_dispatch / dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist.tar.gz
            dist.tar.gz.sha256
            dist-with-maps.tar.gz
            SBOM.cdx.json
          if-no-files-found: error

      - name: Attach to GitHub release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.tar.gz
            dist.tar.gz.sha256
            dist-with-maps.tar.gz
            SBOM.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true

      # ── Cross-repo bump: notify bsky-saves of the new GUI tag ───────────
      #
      # After the release artifacts are live on the GitHub release page,
      # fire a repository_dispatch into tenorune/bsky-saves carrying
      # `version`, the tarball `sha256`, and the tarball download URL.
      # A receiving workflow on the bsky-saves side is expected to open
      # the "Bump GUI to vX.Y.Z" PR — that repo knows its own file
      # layout (pyproject.toml vs gui-version.txt vs sibling .sha256),
      # so the cross-repo contract stays at the payload shape only.
      #
      # Requires a fine-grained PAT scoped to tenorune/bsky-saves with
      # Contents: read-and-write (sufficient for repository_dispatch),
      # stored as the repo secret BSKY_SAVES_DISPATCH_TOKEN. When the
      # secret isn't set, the step skips with a warning annotation
      # rather than failing the release — the bsky-saves side can be
      # wired in independently from this side.
      - name: Dispatch gui-version-bump to bsky-saves
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && env.BSKY_SAVES_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.BSKY_SAVES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(awk '{print $1}' dist.tar.gz.sha256)
          TARBALL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dist.tar.gz"
          echo "Dispatching gui-version-bump to tenorune/bsky-saves"
          echo "  version:     $VERSION"
          echo "  sha256:      $SHA"
          echo "  tarball_url: $TARBALL_URL"
          jq -nc \
            --arg version "$VERSION" \
            --arg sha256 "$SHA" \
            --arg tarball_url "$TARBALL_URL" \
            --arg ref_name "$GITHUB_REF_NAME" \
            '{event_type: "gui-version-bump", client_payload: {version: $version, sha256: $sha256, tarball_url: $tarball_url, ref_name: $ref_name}}' \
            | gh api repos/tenorune/bsky-saves/dispatches --input -
          echo "Dispatch sent."

      - name: Cross-repo bump skipped (no token)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && env.BSKY_SAVES_DISPATCH_TOKEN == ''
        run: |
          echo "::warning::Cross-repo bump skipped: BSKY_SAVES_DISPATCH_TOKEN secret not set."
          echo "To enable, create a fine-grained PAT with Contents: read-and-write"
          echo "on tenorune/bsky-saves and store it as the repo secret"
          echo "BSKY_SAVES_DISPATCH_TOKEN under Settings → Secrets and variables → Actions."
