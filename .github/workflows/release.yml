name: release

# Release-gate workflow (docs/bsky-saves-gui-dist-workstream.md §5).
#
# Triggers:
#   - push to a vX.Y.Z tag: full gate + attach artifacts to a GitHub release.
#   - workflow_dispatch: dry-run; same gate, artifacts uploaded to the workflow
#     run (Actions → run → Artifacts) but no GitHub release is created.
#
# Phase 1 scope:
#   S1 build cleanliness · S2 bundle integrity · S3 bundle hygiene
#   S4 PWA / service-worker sanity · S6 secret scan + dependency audit
#   S9 artifact production (dist.tar.gz + .sha256, plus dist-with-maps.tar.gz)
# Phase 2 additions:
#   S6 SBOM — CycloneDX bill of materials attached to the release.
# Deferred to later phases: S5 Playwright vs real helper,
# S7 cross-context boot, S8 MIN_HELPER_VERSION coordination.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Label for this dry-run build (e.g. v0.3.0-rc1)'
        required: true
        default: 'dry-run'

permissions:
  contents: write  # required so the tag-push path can attach to the release

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # ── S1 — Build cleanliness ───────────────────────────────────────────
      - name: S1 — Install
        run: pnpm install --frozen-lockfile

      - name: Seed .env with defaults
        # The build step below overrides VITE_* via env: with repo-vars. The
        # .env file is still needed so `pnpm check`/`pnpm test` have non-empty
        # values for config.ts's required() guards.
        run: cp .env.example .env

      - name: S1 — Type-check
        run: pnpm check

      - name: S1 — Unit tests
        run: pnpm test

      - name: S1 — Cloudflare Worker tests
        run: pnpm exec vitest run --config templates/cf-worker/vitest.config.ts
        timeout-minutes: 3

      - name: S1 — Build
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_DOMAIN: ${{ vars.VITE_APP_DOMAIN }}
          VITE_OPERATOR_HANDLE: ${{ vars.VITE_OPERATOR_HANDLE }}
          VITE_BEACON_AT_URI: ${{ vars.VITE_BEACON_AT_URI }}
          VITE_DEFAULT_PDS: ${{ vars.VITE_DEFAULT_PDS }}
          VITE_HELPER_ORIGIN: ${{ vars.VITE_HELPER_ORIGIN }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_PYODIDE_VERSION: ${{ vars.VITE_PYODIDE_VERSION }}
          VITE_OPERATOR_IMAGE_PROXY_URL: ${{ vars.VITE_OPERATOR_IMAGE_PROXY_URL }}
          VITE_OPERATOR_IMAGE_PROXY_KEY: ${{ vars.VITE_OPERATOR_IMAGE_PROXY_KEY }}
        run: pnpm build

      - name: Confirm CNAME is in dist
        run: test -f dist/CNAME

      # ── S2 — Bundle integrity ────────────────────────────────────────────
      - name: S2 — index.html refs resolve
        run: node tools/verify-bundle-refs.mjs

      # ── S3 — Bundle hygiene ──────────────────────────────────────────────
      #
      # Run against a "release-staging" copy of dist/ with .map files
      # stripped — those ship separately as the dist-with-maps debug artifact.
      - name: Stage release dist (strip sourcemaps)
        run: |
          set -euo pipefail
          rm -rf release-staging
          cp -r dist release-staging
          find release-staging -name '*.map' -delete

      - name: S3 — No sourcemaps in release tarball
        run: |
          set -euo pipefail
          if find release-staging -name '*.map' | grep -q .; then
            echo "FAIL: .map files present in release tarball"
            find release-staging -name '*.map'
            exit 1
          fi

      - name: S3 — No test / config files
        run: |
          set -euo pipefail
          for pattern in '*.test.*' '*.spec.*' '.env*' 'tsconfig*'; do
            if find release-staging -name "$pattern" 2>/dev/null | grep -q .; then
              echo "FAIL: $pattern files in release tarball"
              find release-staging -name "$pattern"
              exit 1
            fi
          done

      - name: S3 — No build-host paths leaked
        # Excludes /home/pyodide/ — Pyodide's emulated-filesystem prefix
        # for the in-worker Python runtime, not a real host path.
        run: |
          set -euo pipefail
          hits=$(grep -rIoE '/home/[a-z]+/|/Users/[a-z]+/|C:\\Users\\' release-staging/ \
                  | grep -v '/home/pyodide/' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: build-host filesystem paths present in release tarball"
            echo "$hits" | head -10
            exit 1
          fi

      - name: S3 — Bundle size budget
        run: |
          set -euo pipefail
          size=$(du -sb release-staging | awk '{print $1}')
          budget=$((1500 * 1024))
          echo "Release tarball size: $size bytes (budget: $budget bytes)"
          if [ "$size" -gt "$budget" ]; then
            echo "FAIL: release tarball exceeds 1.5 MB budget"
            exit 1
          fi
          # Per-chunk budget: 400 KB. CustomProxySetupModal is deliberately
          # large (the inlined cf-worker template + helpers); see vite chunk
          # split notes.
          violators=$(find release-staging -name '*.js' -size +400k ! -name 'CustomProxySetupModal*' || true)
          if [ -n "$violators" ]; then
            echo "FAIL: chunks over 400 KB (excluding CustomProxySetupModal):"
            echo "$violators"
            exit 1
          fi

      # ── S4 — PWA / service-worker sanity ─────────────────────────────────
      - name: S4 — Precache manifest references resolve
        run: node tools/verify-precache.mjs

      # ── S6 — Security scans ──────────────────────────────────────────────
      - name: S6 — Credential-shape scan (gate)
        # Narrow patterns that catch actual leaked secrets without false-
        # positiving on UI copy. Each pattern targets a known credential
        # format — if any match, fail loudly.
        run: |
          set -euo pipefail
          # Bluesky app passwords have shape xxxx-xxxx-xxxx-xxxx, but the
          # pattern is too generic (matches UUIDs, hashes, UI placeholders
          # like xxxx-xxxx-xxxx-xxxx in SignIn) — relying on it would force
          # an allowlist for every build. Apps passwords are user input,
          # not code constants, so the realistic risk of one being baked
          # into the bundle is near-zero. Pattern omitted intentionally.
          patterns=(
            'eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]+'   # JWT
            'gh[pousr]_[A-Za-z0-9]{36,}'                                  # GitHub PAT
            'AKIA[0-9A-Z]{16}'                                            # AWS access key
            'xox[baprs]-[A-Za-z0-9-]{10,}'                                # Slack token
          )
          failed=0
          for pat in "${patterns[@]}"; do
            if grep -rIE "$pat" release-staging/ ; then
              echo "FAIL: credential pattern matched: $pat"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: S6 — Broad keyword scan (informational)
        # Documented in the workstream doc; minified bundles produce noisy
        # matches (e.g. SHARED_SECRET in cf-worker template UI copy), so this
        # step does NOT gate the build. Operators should still skim the
        # output before tagging.
        run: |
          set +e
          echo "::group::Broad keyword matches (informational)"
          grep -roIE 'BLUESKY_[A-Z_]+|CLOUDFLARE_[A-Z_]+|API_KEY|SECRET|TOKEN' release-staging/ \
            | sort | uniq -c | sort -rn | head -20
          echo "::endgroup::"

      - name: S6 — Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level=high

      - name: S6 — CycloneDX SBOM
        # Scans the production dependency tree (per --required-only) and emits
        # a CycloneDX 1.x JSON SBOM. Pinned to a specific cdxgen version so
        # the SBOM shape is stable across runs; bump deliberately. The SBOM
        # ships alongside the release tarball so downstream consumers (wheel,
        # installers) can audit the exact transitive deps the bundle was
        # built against and diff between releases.
        run: |
          set -euo pipefail
          pnpm dlx @cyclonedx/cdxgen@12.3.3 -o SBOM.cdx.json -t pnpm --required-only
          echo "SBOM produced:"
          ls -l SBOM.cdx.json
          # Sanity-check: must be valid JSON with the CycloneDX shape and a
          # non-zero component count.
          node -e '
            const sbom = JSON.parse(require("fs").readFileSync("SBOM.cdx.json", "utf8"));
            if (sbom.bomFormat !== "CycloneDX") { console.error("Not a CycloneDX SBOM"); process.exit(1); }
            const n = (sbom.components || []).length;
            if (n < 10) { console.error(`SBOM component count suspiciously low: ${n}`); process.exit(1); }
            console.log(`OK: CycloneDX ${sbom.specVersion}, ${n} components`);
          '

      # ── S9 — Artifact production ─────────────────────────────────────────
      - name: Determine version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: S9 — Pack release tarball
        run: |
          set -euo pipefail
          tar czf dist.tar.gz -C release-staging .
          sha256sum dist.tar.gz > dist.tar.gz.sha256
          echo "Release tarball:"
          ls -l dist.tar.gz dist.tar.gz.sha256

      - name: S9 — Pack debug-with-maps tarball
        run: |
          set -euo pipefail
          tar czf dist-with-maps.tar.gz -C dist .
          echo "Debug tarball:"
          ls -l dist-with-maps.tar.gz

      - name: Upload release artifacts (workflow_dispatch / dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist.tar.gz
            dist.tar.gz.sha256
            dist-with-maps.tar.gz
            SBOM.cdx.json
          if-no-files-found: error

      - name: Attach to GitHub release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.tar.gz
            dist.tar.gz.sha256
            dist-with-maps.tar.gz
            SBOM.cdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
