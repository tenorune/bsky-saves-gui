<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy. Notes on choices:
         - script-src 'self' 'wasm-unsafe-eval': all JS comes from this origin;
           wasm-unsafe-eval allows WebAssembly compilation (Pyodide). No
           'unsafe-eval' — the Pyodide worker runs in its own context.
         - style-src 'self' 'unsafe-inline': required for Svelte's dynamic
           style="" attributes (e.g. progress-bar width).
         - connect-src: https: covers arbitrary user PDS hosts and the
           Pyodide CDN; http://127.0.0.1:* + http://localhost:* covers the
           local helper across configurable ports.
         - worker-src 'self' blob:: Vite emits hashed worker files at /assets
           in prod and blob: URLs in dev.
         - frame-ancestors cannot be set from a meta tag and must come from
           a real response header (X-Frame-Options / CSP header). See
           docs/bsky-saves-gui-dist-workstream.md (§3 R2) for the deploy
           options that would enable it. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="Export your Bluesky saved posts. Runs entirely in your browser." />
    <!--
      Placeholder for the bsky-saves helper session token. When the GUI is
      served by `bsky-saves serve --gui`, the helper substitutes the
      `__BSKY_SAVES_TOKEN__` sentinel with the real per-install token
      before writing the response. When the GUI is served from
      saves.lightseed.net (no helper involved), the sentinel reaches the
      browser as-is; the GUI's startup code treats the literal sentinel
      (or any value that doesn't shape-match a base64url token) as
      "unpaired" and prompts the user to paste a token from
      `bsky-saves token`. Spec:
      docs/bsky-saves-gui-dist-workstream.md §4 item 11.
    -->
    <meta name="bsky-saves-token" content="__BSKY_SAVES_TOKEN__" />
    <!-- SVG favicon first (crisp at every size; modern browsers prefer it);
         favicon.ico is the legacy fallback. Both are the blue-circle +
         white-bookmark mark, regenerated by tools/build-pwa-icons.mjs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app/src/main.ts"></script>
  </body>
</html>
